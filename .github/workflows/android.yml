name: Android build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Stable link that always serves the newest release (keep the asset name fixed).
  LATEST_APK_URL: https://github.com/${{ github.repository }}/releases/latest/download/AppDownloader.apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v([0-9]+)\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            echo "::error::Release tags must look like v1.2.3 (minor and patch below 100), got $tag"
            exit 1
          fi
          echo "APP_VERSION_NAME=${tag#v}" >> "$GITHUB_ENV"

      # Sign with the project's release key so installed copies can be updated in place.
      # Repository secrets: SIGNING_KEYSTORE_BASE64, SIGNING_KEYSTORE_PASSWORD,
      # SIGNING_KEY_ALIAS and SIGNING_KEY_PASSWORD.
      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # A release signed with a throw-away key could not update installed copies,
      # so refuse to publish one.
      - name: Require release signing key for tagged releases
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNING_KEYSTORE_FILE == ''
        run: |
          echo "::error::Tagged releases need the SIGNING_* repository secrets (see README)."
          exit 1

      - name: Test and build
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AppDownloader-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/AppDownloader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AppDownloader-apks
          path: dist/*.apk

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          AFTV_CODE: ${{ vars.AFTV_CODE }}
        run: |
          .github/scripts/release-notes.sh "$APP_VERSION_NAME" > "$RUNNER_TEMP/notes.md"
          {
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "## How to install"
            if [ -n "$AFTV_CODE" ]; then
              echo "- **Fire TV / Android TV:** in the Downloader app, enter code **$AFTV_CODE** (or open https://aftv.news/$AFTV_CODE)"
            fi
            echo "- **Direct download (always the latest version):** $LATEST_APK_URL"
            echo "- Already installed? Open App Downloader and it will offer the update."
          } > "$RUNNER_TEMP/release-body.md"

      - name: Publish GitHub release
        id: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: App Downloader ${{ env.APP_VERSION_NAME }}
          body_path: ${{ runner.temp }}/release-body.md
          files: dist/AppDownloader.apk
          make_latest: true

      - name: Announce on Discord
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          AFTV_CODE: ${{ vars.AFTV_CODE }}
          VERSION: ${{ env.APP_VERSION_NAME }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          DOWNLOAD_URL: ${{ env.LATEST_APK_URL }}
          NOTES_FILE: ${{ runner.temp }}/notes.md
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret not set; skipping announcement."
            exit 0
          fi
          .github/scripts/discord-notify.sh
