name: Android build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.0 (publishes to GitHub). Leave empty for a test build."
        required: false
        type: string

permissions:
  contents: write

env:
  # Stable link that always serves the newest release (keep the asset name fixed).
  LATEST_APK_URL: https://github.com/${{ github.repository }}/releases/latest/download/SiloraUpdater.apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # A release is either a pushed v1.2.3 tag, or "Run workflow" with a version entered.
      - name: Determine release version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              echo "::error::v$version already exists. Choose a higher version."
              exit 1
            fi
          else
            echo "Not a release; building only."
            exit 0
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "::error::Versions must look like 1.2.3 (minor and patch below 100), got $version"
            exit 1
          fi
          echo "APP_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "IS_RELEASE=true" >> "$GITHUB_ENV"
          echo "Releasing version $version"

      # Sign with the project's release key so installed copies can be updated in place.
      # Repository secrets: SIGNING_KEYSTORE_BASE64, SIGNING_KEYSTORE_PASSWORD,
      # SIGNING_KEY_ALIAS and SIGNING_KEY_PASSWORD.
      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # A release signed with a throw-away key could not update installed copies,
      # so refuse to publish one.
      - name: Require release signing key for tagged releases
        if: env.IS_RELEASE == 'true' && env.SIGNING_KEYSTORE_FILE == ''
        run: |
          echo "::error::Releases need the SIGNING_* repository secrets (see README)."
          exit 1

      - name: Test and build
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease

      - name: Rename APKs
        run: |
          mkdir -p dist
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/SiloraUpdater.apk
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist/SiloraUpdater-unsigned.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: SiloraUpdater-apks
          path: dist/*.apk

      - name: Write release notes
        if: env.IS_RELEASE == 'true'
        env:
          AFTV_CODE: ${{ vars.AFTV_CODE }}
        run: |
          .github/scripts/release-notes.sh "$APP_VERSION_NAME" > "$RUNNER_TEMP/notes.md"
          {
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "## How to install"
            echo "Works on Android phones, tablets, Fire TV and Android TV."
            if [ -n "$AFTV_CODE" ]; then
              echo "- **Phone or tablet:** open https://aftv.news/$AFTV_CODE in your browser and install the download"
              echo "- **TV:** in the Downloader app, enter code **$AFTV_CODE**"
            fi
            echo "- **Direct download (always the latest version):** $LATEST_APK_URL"
            echo "- Open Silora Updater and choose Install Silora or Update Silora."
          } > "$RUNNER_TEMP/release-body.md"

      - name: Publish GitHub release
        id: release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: Silora Updater ${{ env.APP_VERSION_NAME }}
          body_path: ${{ runner.temp }}/release-body.md
          files: dist/SiloraUpdater.apk
          make_latest: true
